
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub-Admin | Wariara Cars Central Rift</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <header class="bg-slate-950 text-white px-5 h-16 flex items-center justify-between"><strong>Wariara Sub-Admin</strong><button onclick="logoutSub()" class="text-xs">Sign out</button></header>
  <main class="max-w-7xl mx-auto p-4">
    <section id="gate" class="max-w-md mx-auto bg-white rounded-xl border p-5">
      <h1 class="text-xl font-extrabold">Sub-Admin Login</h1>
      <input id="password" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 mt-3" />
      <button onclick="loginSub(this)" class="w-full mt-3 bg-emerald-600 text-white font-bold py-2.5 rounded-lg">Continue</button>
      <div id="code-box" class="hidden mt-3"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit email code" class="w-full border rounded-lg px-3 py-2" /><button onclick="verifySub(this)" class="w-full mt-2 bg-slate-900 text-white font-bold py-2.5 rounded-lg">Verify 10-minute code</button></div>
      <p id="gate-status" class="text-xs text-red-700 mt-3"></p>
    </section>

    <section id="panel" class="hidden space-y-4">
      <div class="flex flex-wrap gap-2">
        <button onclick="tab('posts')" id="t-posts" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Posts & Review</button>
        <button onclick="tab('payments')" id="t-payments" class="bg-white border px-4 py-2 rounded-lg text-sm font-bold">Payments</button>
        <button onclick="tab('users')" id="t-users" class="bg-white border px-4 py-2 rounded-lg text-sm font-bold">Accounts</button>
        <button onclick="tab('config')" id="t-config" class="bg-white border px-4 py-2 rounded-lg text-sm font-bold">Plans & Catalog</button>
        <button onclick="loadOverview(true)" class="ml-auto bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Refresh</button>
      </div>

      <div id="sec-posts" class="space-y-3">
        <div class="flex flex-wrap gap-2 bg-white border rounded-xl p-3 text-xs font-bold">
          <button onclick="setPostFilter('all')" id="pf-all" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white">All Posts</button>
          <button onclick="setPostFilter('expired')" id="pf-expired" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200">Expired Posts</button>
          <button onclick="setPostFilter('pending_approval')" id="pf-pending_approval" class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">Pending Approval</button>
          <button onclick="setPostFilter('active')" id="pf-active" class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200">Active</button>
          <button onclick="setPostFilter('sold')" id="pf-sold" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-700 border border-red-200">Sold</button>
        </div>
        <div id="posts" class="space-y-2"></div>
      </div>

      <div id="sec-payments" class="hidden bg-white rounded-xl border p-5"><h2 class="font-extrabold mb-3">Payment Notifications</h2><div id="payments" class="divide-y text-sm"></div></div>

      <div id="sec-users" class="hidden bg-white rounded-xl border p-5 overflow-x-auto"><div id="users" class="space-y-2"></div></div>

      <div id="sec-config" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="bg-white border rounded-xl p-4"><h2 class="font-bold mb-3">Sponsored Priority Plans</h2><div id="priority-plans" class="space-y-2"></div><div class="grid grid-cols-3 gap-1 mt-3 text-xs"><input id="npp-name" placeholder="Name" class="border rounded px-1 py-1"><input id="npp-hours" type="number" placeholder="Hours" class="border rounded px-1 py-1"><input id="npp-price" type="number" placeholder="KES" class="border rounded px-1 py-1"></div><button onclick="addPriority(this)" class="mt-2 w-full bg-slate-900 text-white text-xs font-bold py-2 rounded">Add Priority Plan</button></div>
        <div class="bg-white border rounded-xl p-4"><h2 class="font-bold mb-3">Post Plans</h2><div id="post-plans" class="space-y-2"></div><div class="grid grid-cols-3 gap-1 mt-3 text-xs"><input id="np-name" placeholder="Name" class="border rounded px-1 py-1"><input id="np-count" type="number" placeholder="Posts" class="border rounded px-1 py-1"><input id="np-price" type="number" placeholder="KES" class="border rounded px-1 py-1"></div><button onclick="addPostPlan(this)" class="mt-2 w-full bg-slate-900 text-white text-xs font-bold py-2 rounded">Add Post Plan</button></div>
        <div class="bg-white border rounded-xl p-4"><h2 class="font-bold mb-3">Add Catalog Item</h2><div class="grid gap-2 text-xs"><select id="c-vt" class="border rounded px-2 py-2"><option>Car</option><option>Truck</option><option>Bike</option></select><input id="c-br" placeholder="Brand" class="border rounded px-2 py-2"><input id="c-mo" placeholder="Model" class="border rounded px-2 py-2"><input id="c-bo" placeholder="Body type" class="border rounded px-2 py-2"><button onclick="addCatalog(this)" class="bg-emerald-600 text-white font-bold py-2 rounded">Add</button></div></div>
      </div>
    </section>

    <div id="gift-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl max-w-sm w-full p-5"><h2 class="font-extrabold text-lg">Gift Post Credits</h2><input id="gift-user-id" type="hidden"><input id="gift-count" type="number" min="1" value="5" class="w-full border rounded-lg px-3 py-2 mt-3 text-sm"><input id="gift-phone" type="tel" placeholder="Seller's registered WhatsApp number" class="w-full border rounded-lg px-3 py-2 mt-2 text-sm"><div class="flex gap-2 mt-4"><button onclick="closeGift()" class="flex-1 border rounded-lg py-2 font-bold">Cancel</button><button onclick="submitGift(this)" class="flex-1 bg-emerald-600 text-white rounded-lg py-2 font-bold">Confirm Gift</button></div></div>
    </div>
  </main>
<script>
const API_BASE = window.WARIARA_API_CONFIG.API_BASE;
let session = localStorage.getItem("wariara_sub_session") || "";
let data = null;
let postFilter = "all";

function setPostFilter(filter) {
  postFilter = filter;
  ["all","expired","pending_approval","active","sold"].forEach((item) => {
    const button = document.getElementById(`pf-${item}`);
    if (!button) return;
    button.className = item === filter
      ? "px-3 py-1.5 rounded-lg bg-slate-900 text-white"
      : "px-3 py-1.5 rounded-lg bg-white border";
  });
  renderSubPosts();
}

async function subFetch(path, options = {}) {
  const headers = { ...(options.headers || {}), "x-sub-admin-session": session };
  if (options.body) headers["Content-Type"] = "application/json";
  let response;
  try {
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        response = await fetch(API_BASE + path, { ...options, headers, cache: "no-store", signal: AbortSignal.timeout(30000) });
        lastError = null;
        break;
      } catch (error) {
        lastError = error;
        if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 500));
      }
    }
    if (!response) throw lastError || new Error("Request failed");
  } catch (_) {
    throw new Error("The API is temporarily unavailable. Please try again.");
  }
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || "Request failed");
  return result;
}

async function loginSub(btn) {
  btn.disabled = true;
  try {
    let r;
    try {
      r = await fetch(API_BASE + "/api/admin/sub/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("password").value }), signal: AbortSignal.timeout(30000) });
    } catch (_) {
      throw new Error("The API is unavailable right now. Please try again.");
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (d.requires_code) {
      document.getElementById("code-box").classList.remove("hidden");
      document.getElementById("gate-status").textContent = `Enter the code sent to ${d.email_hint}`;
    } else openPanel(d.session_token);
  } catch (e) { document.getElementById("gate-status").textContent = e.message; }
  finally { btn.disabled = false; }
}

async function verifySub(btn) {
  btn.disabled = true;
  try {
    let r;
    try {
      r = await fetch(API_BASE + "/api/admin/sub/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("password").value, code: document.getElementById("code").value }), signal: AbortSignal.timeout(30000) });
    } catch (_) {
      throw new Error("The API is unavailable right now. Please try again.");
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    openPanel(d.session_token);
  } catch (e) { document.getElementById("gate-status").textContent = e.message; }
  finally { btn.disabled = false; }
}

function openPanel(token) {
  session = token;
  localStorage.setItem("wariara_sub_session", token);
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  tab("posts");
  loadOverview(true);
}
function logoutSub() {
  session = "";
  localStorage.removeItem("wariara_sub_session");
  location.reload();
}

function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tab(name) {
  ["posts","payments","users","config"].forEach(t => {
    document.getElementById(`sec-${t}`).classList.toggle("hidden", t !== name);
    document.getElementById(`t-${t}`).className = t === name ? "bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold" : "bg-white border px-4 py-2 rounded-lg text-sm font-bold";
  });
}
function renderSubPosts() {
  if (!data) return;
  const listings = postFilter === "all"
    ? data.listings
    : data.listings.filter((listing) => listing.status === postFilter);
  document.getElementById("posts").innerHTML = listings.length
    ? listings.map(l => `<div class="bg-white border rounded-lg p-3 text-xs"><strong>${escapeHtml(l.title)}</strong><div>${l.status} · ${escapeHtml(l.seller_name)}</div>${l.report_reason ? `<div class="text-red-700">Report: ${escapeHtml(l.report_reason)}</div>` : ""}<div class="flex flex-wrap gap-1 mt-2"><button onclick="editListing('${l.id}',this)" class="bg-sky-700 text-white px-2 py-1 rounded">Edit</button><button onclick="moderate('${l.id}','approve',this)" class="bg-emerald-600 text-white px-2 py-1 rounded">Approve</button><button onclick="moderate('${l.id}','reject',this)" class="bg-red-600 text-white px-2 py-1 rounded">Reject</button><button onclick="moderate('${l.id}','mark_safe',this)" class="bg-slate-700 text-white px-2 py-1 rounded">Restore</button><button onclick="moderate('${l.id}','pause',this)" class="border px-2 py-1 rounded">Pause</button><button onclick="moderate('${l.id}','unpause',this)" class="border px-2 py-1 rounded">Unpause</button></div></div>`).join("")
    : `<div class="bg-white border rounded-lg p-5 text-xs text-slate-500">No posts match this filter.</div>`;
}
async function loadOverview(force = false) {
  try {
    const cacheKey = "wariara_sub_admin_overview";
    if (!force) {
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
        if (cached?.expiresAt > Date.now()) data = cached.value;
      } catch (_) {}
    }
    if (!data) data = await subFetch("/api/admin/overview");
    else if (force) data = await subFetch("/api/admin/overview");
    sessionStorage.setItem(cacheKey, JSON.stringify({ value: data, expiresAt: Date.now() + 15 * 1000 }));
    renderSubPosts();
    document.getElementById("payments").innerHTML = (data.paymentNotifications || []).length ? data.paymentNotifications.map(n => `<div class="py-3"><strong>${escapeHtml(n.payer_name)}</strong> · KES ${Number(n.amount_kes).toLocaleString()}<div>${escapeHtml(n.purpose)} · ${escapeHtml(n.payment_ref || "")}</div></div>`).join("") : `<div class="py-3 text-slate-500">No payments</div>`;
    document.getElementById("users").innerHTML = data.users.map(u => `<div class="border rounded-lg p-3 text-xs"><strong>${escapeHtml(u.name)}</strong> · ${u.is_suspended ? "Suspended" : "Active"}<div>${escapeHtml(u.email)} · WA ${escapeHtml(u.whatsapp_phone)} · Free ${u.free_posts_used}/6 · Credits ${u.paid_post_credits}</div><div class="mt-2">${u.appeal_status === "pending" ? `Review: ${escapeHtml(u.appeal_text)} · <button onclick="appeal('${u.id}','accept',this)" class="bg-emerald-600 text-white px-2 py-1 rounded">Accept & Restore</button> <button onclick="appeal('${u.id}','reject',this)" class="bg-amber-600 text-white px-2 py-1 rounded">Reject</button>` : escapeHtml(u.appeal_response || u.appeal_status)}</div><div class="flex flex-wrap gap-1 mt-2"><button onclick="editUser('${u.id}',this)" class="bg-sky-700 text-white px-2 py-1 rounded">Edit</button><button onclick="openGift('${u.id}',this)" class="bg-emerald-600 text-white px-2 py-1 rounded">Gift Posts</button><button onclick="suspendUser('${u.id}',true,this)" class="bg-red-600 text-white px-2 py-1 rounded">Suspend</button><button onclick="suspendUser('${u.id}',false,this)" class="bg-slate-900 text-white px-2 py-1 rounded">Restore</button></div></div>`).join("");
    document.getElementById("priority-plans").innerHTML = data.priorityPlans.map(p => `<div class="grid grid-cols-5 gap-1 text-xs"><input id="spn-${p.id}" value="${escapeHtml(p.name)}" class="border rounded px-1 py-1"><input id="sph-${p.id}" type="number" value="${p.duration_hours}" class="border rounded px-1 py-1"><input id="spp-${p.id}" type="number" value="${p.price_kes}" class="border rounded px-1 py-1"><button onclick="savePriority('${p.id}',this)" class="bg-emerald-600 text-white rounded">Save</button><button onclick="deletePriority('${p.id}',this)" class="bg-red-600 text-white rounded">Delete</button></div>`).join("");
    document.getElementById("post-plans").innerHTML = data.plans.map(p => `<div class="grid grid-cols-4 gap-1 text-xs"><input id="pln-${p.id}" value="${escapeHtml(p.name)}" class="border rounded px-1 py-1"><input id="plc-${p.id}" type="number" value="${p.post_count}" class="border rounded px-1 py-1"><input id="plp-${p.id}" type="number" value="${p.price_kes}" class="border rounded px-1 py-1"><button onclick="savePostPlan('${p.id}',this)" class="bg-emerald-600 text-white rounded">Save</button></div>`).join("");
  } catch (e) { if (e.message.includes("expired") || e.message.includes("Invalid")) logoutSub(); document.getElementById("gate-status").textContent = e.message; alert(e.message); }
}
async function moderate(id, action, btn) { btn.disabled=true; try { await subFetch(`/api/admin/listings/${id}/moderate`, { method:"POST", body:JSON.stringify({action}) }); await loadOverview(); } catch(e){alert(e.message)} finally { if(btn) btn.disabled=false; } }
async function suspendUser(id, suspend, btn) { btn.disabled=true; const reason=suspend?prompt("Suspension reason:"):null; if(suspend&&!reason)return btn.disabled=false; try { await subFetch(`/api/admin/users/${id}/suspension`, { method:"POST", body:JSON.stringify({suspend,reason}) }); await loadOverview(); } catch(e){alert(e.message)} finally { if(btn) btn.disabled=false; } }
async function appeal(id, action, btn) { const response=prompt("Enter the response sent to the seller:"); if(!response)return; try { await subFetch(`/api/admin/users/${id}/appeal`, { method:"POST", body:JSON.stringify({action,response}) }); await loadOverview(); } catch(e){alert(e.message)} }
async function editListing(id) { const l=data.listings.find(x=>x.id===id); if(!l)return; const title=prompt("Title",l.title); if(title===null)return; const price=prompt("Price KES",l.price_kes||0); if(price===null)return; const town=prompt("Town",l.town||""); if(town===null)return; const description=prompt("Description",l.description||""); if(description===null)return; try { await subFetch(`/api/admin/listings/${id}`,{method:"PUT",body:JSON.stringify({title,price_kes:Number(price)||0,town,description})}); await loadOverview(); } catch(e){alert(e.message)} }
async function editUser(id) { const u=data.users.find(x=>x.id===id); if(!u)return; const name=prompt("Account name",u.name); if(name===null)return; const town=prompt("Town",u.town||""); if(town===null)return; const role=confirm("OK = dealership, Cancel = private seller")?"dealer":"private"; try { await subFetch(`/api/admin/users/${id}/profile`,{method:"PUT",body:JSON.stringify({name,town,role,agent_of:null})}); await loadOverview(); } catch(e){alert(e.message)} }
function openGift(id) { document.getElementById("gift-user-id").value=id; document.getElementById("gift-count").value="5"; document.getElementById("gift-phone").value=""; document.getElementById("gift-modal").classList.remove("hidden"); }
function closeGift(){document.getElementById("gift-modal").classList.add("hidden")}
async function submitGift(btn){ const id=document.getElementById("gift-user-id").value; const posts_count=Number(document.getElementById("gift-count").value); const confirm_whatsapp=document.getElementById("gift-phone").value.trim(); if(posts_count<1)return alert("Enter a valid post count."); if(!confirm_whatsapp)return alert("Enter the registered WhatsApp number."); btn.disabled=true; try { await subFetch(`/api/admin/users/${id}/gift-posts`,{method:"POST",body:JSON.stringify({posts_count,confirm_whatsapp})}); closeGift(); await loadOverview(); alert("Gift posts added."); } catch(e){alert(e.message)} finally{btn.disabled=false} }
async function savePriority(id,btn){ btn.disabled=true; try{await subFetch(`/api/admin/priority-plans/${id}`,{method:"PUT",body:JSON.stringify({name:document.getElementById(`spn-${id}`).value,duration_hours:Number(document.getElementById(`sph-${id}`).value),price_kes:Number(document.getElementById(`spp-${id}`).value)})}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
async function savePostPlan(id,btn){ btn.disabled=true; try{await subFetch(`/api/admin/plans/${id}`,{method:"PUT",body:JSON.stringify({name:document.getElementById(`pln-${id}`).value,post_count:Number(document.getElementById(`plc-${id}`).value),price_kes:Number(document.getElementById(`plp-${id}`).value)})}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
async function deletePriority(id,btn){ if(!confirm('Delete this priority plan?'))return; btn.disabled=true; try{await subFetch(`/api/admin/priority-plans/${id}`,{method:'DELETE'}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
async function addPriority(btn){ btn.disabled=true; try{await subFetch('/api/admin/priority-plans',{method:'POST',body:JSON.stringify({name:document.getElementById('npp-name').value,duration_hours:Number(document.getElementById('npp-hours').value),price_kes:Number(document.getElementById('npp-price').value)})}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
async function addPostPlan(btn){ btn.disabled=true; try{await subFetch('/api/admin/plans',{method:'POST',body:JSON.stringify({name:document.getElementById('np-name').value,post_count:Number(document.getElementById('np-count').value),price_kes:Number(document.getElementById('np-price').value)})}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
async function addCatalog(btn){ btn.disabled=true; try{await subFetch('/api/admin/catalog',{method:'POST',body:JSON.stringify({vehicle_type:document.getElementById('c-vt').value,brand:document.getElementById('c-br').value,model:document.getElementById('c-mo').value,body_type:document.getElementById('c-bo').value})}); await loadOverview(); }catch(e){alert(e.message)}finally{btn.disabled=false} }
if (session) openPanel(session);
</script>
</body>
</html>
